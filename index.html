<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Floating Sprite</title>
    
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="interactive-layout">

    <div class="character-container">
  
        <img src="otto.png" alt="Floating Character" class="sprite">
  
        <div class="bubble-wrapper">
            <div class="speech-bubble">
                <p id="typing-text"></p>
            </div>
            <div id="tap-prompt" class="hidden">▼ Tap to continue</div>
        </div>
    </div>

    <div id="button-container" class="hidden">
        <input type="text" id="cultivator-name" class="neon-input" placeholder="Your Cultivator Name" autocomplete="off">
        <input type="text" id="ticket-number" class="neon-input" placeholder="Your Ticket Number" autocomplete="off">
        <div id="entry-error" class="entry-error">Please fill in both fields before entering.</div>
        <a href="story.html" id="enter-btn" class="neon-btn is-disabled">ENTER</a>
    </div>
</div>

    <script src="script.js"></script>
    
</body>
</html>
